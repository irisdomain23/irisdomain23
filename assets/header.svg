<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="880" height="200" fill="url(#bg)"/>

  <!-- 1px guide lines -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="0" y1="36" x2="880" y2="36"/>
    <line x1="0" y1="164" x2="880" y2="164"/>
    <line x1="540" y1="36" x2="540" y2="164"/>
    <line x1="40" y1="36" x2="40" y2="164" opacity="0.5"/>
  </g>
  <rect x="540" y="36" width="340" height="128" fill="url(#fadeR)"/>

  <!-- meta labels -->
  <text x="40" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7d8590" letter-spacing="1">
    <tspan fill="#58a6a6"></tspan> iris-lin · main
  </text>
  <text x="840" y="24" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7d8590" letter-spacing="1">a11y: AA</text>

  <!-- Left: identity -->
  <text x="64" y="92" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#e6edf3" letter-spacing="0.5">Iris Lin</text>
  <text x="66" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#61DAFB" letter-spacing="3">FRONTEND ENGINEER · ACCESSIBILITY</text>
  <text x="66" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7d8590" letter-spacing="0.5">React · TypeScript · a11y · CSS · Testing Library</text>

  <!-- Right: component tree -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- connectors -->
    <g stroke="#21262d" stroke-width="1" fill="none">
      <path d="M660 60 v14 h-46 v14"/>
      <path d="M660 60 v14 h46 v14"/>
      <path d="M614 100 v10"/>
      <path d="M706 100 v10"/>
    </g>

    <!-- root node -->
    <g>
      <rect x="636" y="44" width="48" height="18" rx="3" fill="#161b22" stroke="#58a6a6" stroke-width="1"/>
      <text x="660" y="56.5" text-anchor="middle" font-size="9" fill="#e6edf3">&lt;App/&gt;</text>
      <rect x="636" y="44" width="48" height="18" rx="3" fill="#61DAFB" opacity="0">
        <animate attributeName="opacity" values="0;0.12;0;0;0;0" keyTimes="0;0.12;0.22;0.5;0.8;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- child nodes -->
    <g>
      <rect x="590" y="90" width="48" height="18" rx="3" fill="#161b22" stroke="#58a6a6" stroke-width="1"/>
      <text x="614" y="102.5" text-anchor="middle" font-size="9" fill="#e6edf3">&lt;Nav/&gt;</text>
      <rect x="590" y="90" width="48" height="18" rx="3" fill="#61DAFB" opacity="0">
        <animate attributeName="opacity" values="0;0;0.12;0;0" keyTimes="0;0.2;0.32;0.45;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g>
      <rect x="682" y="90" width="56" height="18" rx="3" fill="#161b22" stroke="#58a6a6" stroke-width="1"/>
      <text x="710" y="102.5" text-anchor="middle" font-size="9" fill="#e6edf3">&lt;Main/&gt;</text>
      <rect x="682" y="90" width="56" height="18" rx="3" fill="#61DAFB" opacity="0">
        <animate attributeName="opacity" values="0;0;0.12;0;0" keyTimes="0;0.45;0.57;0.7;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- leaf nodes -->
    <g>
      <rect x="592" y="122" width="44" height="16" rx="3" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <text x="614" y="133.5" text-anchor="middle" font-size="8" fill="#7d8590">button</text>
    </g>
    <g>
      <rect x="686" y="122" width="44" height="16" rx="3" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <text x="708" y="133.5" text-anchor="middle" font-size="8" fill="#7d8590">form</text>
    </g>

    <!-- traveling a11y focus ring -->
    <rect x="636" y="44" width="48" height="18" rx="4" fill="none" stroke="#61DAFB" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.9">
      <animate attributeName="x" values="636;636;590;590;682;682;636" keyTimes="0;0.22;0.28;0.5;0.56;0.85;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="44;44;90;90;90;90;44" keyTimes="0;0.22;0.28;0.5;0.56;0.85;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="width" values="48;48;48;48;56;56;48" keyTimes="0;0.22;0.28;0.5;0.56;0.85;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pulsing React atom -->
  <g transform="translate(798,88)" stroke="#61DAFB" fill="none" stroke-width="1.2">
    <g opacity="0.85">
      <ellipse rx="26" ry="10"/>
      <ellipse rx="26" ry="10" transform="rotate(60)"/>
      <ellipse rx="26" ry="10" transform="rotate(120)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.55;0.85" dur="4s" repeatCount="indefinite"/>
    </g>
    <circle r="2.6" fill="#61DAFB" stroke="none">
      <animate attributeName="r" values="2.2;3.2;2.2" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- DOM layers stacking, bottom-left of right panel -->
  <g fill="none" stroke="#58a6a6" stroke-width="1" opacity="0.7">
    <rect x="568" y="146" width="34" height="10" rx="2" opacity="0.35">
      <animate attributeName="y" values="146;142;146" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.6;0.35" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="572" y="150" width="34" height="10" rx="2" opacity="0.5">
      <animate attributeName="y" values="150;147;150" dur="5s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.75;0.5" dur="5s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="576" y="154" width="34" height="10" rx="2" opacity="0.65"/>
  </g>

  <!-- bottom-right: version + blinking cursor -->
  <text x="796" y="186" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7d8590">v1.4.2</text>
  <rect x="806" y="176" width="7" height="12" fill="#61DAFB" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.9;0;0;0.9" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>