<svg xmlns="http://www.w3.org/2000/svg" width="720" height="44" viewBox="0 0 720 44">
  <rect width="720" height="44" fill="#0d1117" rx="6"/>
  <text x="14" y="30" font-family="monospace" font-size="13" fill="#61DAFB">&gt;</text>

  <!-- tagline 1 -->
  <text x="30" y="30" font-family="monospace" font-size="13" fill="#8b949e" opacity="0">
    Focus is a design decision &#8212; where it lands after a dialog closes belongs in the spec
    <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.3;0.33;0.66;0.66;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- tagline 2 -->
  <text x="30" y="30" font-family="monospace" font-size="13" fill="#2563eb" opacity="0">
    WCAG 2.2 AA is the floor for anything I ship, not a phase at the end
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.33;0.66;0.66;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- tagline 3 -->
  <text x="30" y="30" font-family="monospace" font-size="13" fill="#61DAFB" opacity="0">
    Ship the boring version, then measure &#8212; most performance work is deleting something
    <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.33;0.33;0.66;0.66;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- blinking cursor right end -->
  <rect x="692" y="16" width="7" height="14" fill="#61DAFB">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
